server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Same origin for the SPA and the API, so the session and CSRF cookies just work. The API sends its own security
    # headers (Spring Security). Uploads: a little above the API's 20 MB limit, so an oversized file gets the API's
    # readable answer instead of nginx's error page.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 21m;
    }

    # The screens. Scripts and styles only from this site (fonts from Google Fonts); no framing by other sites.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html is checked on every visit, so a new version of the app shows without a forced reload.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Built files carry a content hash in their name: safe to keep for a year.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
