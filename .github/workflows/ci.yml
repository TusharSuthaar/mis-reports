# Every push and pull request: backend (unit + integration + guardrail tests) and frontend (types, lint, tests,
# production build, no high/critical vulnerabilities in shipped packages); on pull requests, no dependency added or
# changed (Maven or npm) with a high or critical advisory.
# main only moves with both green (guardrail G-13). Integration tests start Postgres with Testcontainers.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (incl. GuardrailsTest, ArchitectureTest)
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # same as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npx vite build
      - name: No high or critical vulnerabilities in what ships
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  dependencies:
    # Pull requests only: GitHub's dependency review checks every Maven and npm dependency the change adds or moves
    # against the GitHub advisory database (audit: dependency check in CI). Existing ones are watched by Dependabot.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
